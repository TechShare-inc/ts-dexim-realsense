[workspace]
name = "ts-dexim-realsense"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.10.*"

[pypi-dependencies]
dexim-realsense = { path = ".", editable = true }
dexim-core = { git = "https://github.com/TechShare-inc/ts-dexim-core.git", rev = "7bcbec6b8ab8d61e411e87843a0bf6e84fe7ad88" }
dexim-cli-common = { git = "https://github.com/TechShare-inc/ts-dexim-cli-common.git", rev = "f427f441b8258c4430afaa21b011ed78cc22e14e" }

[feature.dev.pypi-dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.11"
mypy = ">=1.11"

[feature.hw.pypi-dependencies]
pyrealsense2 = ">=2.56.0"
opencv-python = ">=4.8.0"

[environments]
default = { features = ["dev"], solve-group = "default" }
hw  = { features = ["hw"],  solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
test = "pytest -q tests"
test-cov = "pytest -q --cov=src tests"
