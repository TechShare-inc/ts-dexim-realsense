[workspace]
name = "ts-dexim-realsense"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.10.*"

[pypi-dependencies]
dexim-realsense = { path = ".", editable = true }
dexim-core = { git = "https://github.com/TechShareRobot/ts-dexim-core.git", branch = "main" }
dexim-cli-common = { git = "https://github.com/TechShareRobot/ts-dexim-cli-common.git", branch = "main" }
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.11"

[tasks]
test = "pytest -q tests/unit"
test-cov = "pytest -q --cov=src tests/unit"
