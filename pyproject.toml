[project]
name = "dexim-realsense"
version = "0.1.0"
description = "RealSense camera node: publish color/depth observations"
readme = "README.md"
authors = [
    { name = "haoyan.li", email = "haoyan.li@techshare.co.jp" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.0",
    "loguru>=0.7.0",
    "dexim-core>=0.1.0",
    "dexim-cli-common>=0.1.0",
    "rich-click>=1.8",
    "pyyaml>=6.0",
    "pyzmq>=26.0.0",
]

[project.scripts]
dexim-realsense = "dexim.realsense.cli:standalone_app"

[project.optional-dependencies]
hw = [
    "pyrealsense2>=2.56.0",
    "opencv-python>=4.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dexim.realsense"
namespace = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: real RealSense hardware required",
]
